name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Check application
        run: |
          node scripts/run-project.cjs typecheck
          node scripts/check-core.mjs
          node scripts/check-project.mjs
      - name: Build signed debug APK
        run: node scripts/run-android.cjs apk
      - name: Verify APK signature and generate checksum
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/*.apk
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sprint47-android-apk
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
